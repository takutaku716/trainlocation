name: Deploy static content to Pages

on:
  push:
    branches: ["2026-08-06-test"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Cancel stale Pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const ids = [
              "300058addda0c8d8688fb3f7063d8e7653201d71",
              "5804e94ce43e6077e76f6c7ded9fdac477874231"
            ];
            for (const id of ids) {
              try {
                await github.request(
                  "POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel",
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pages_deployment_id: id
                  }
                );
                core.info("Cancelled stale deployment " + id);
              } catch (error) {
                if (error.status === 404) {
                  core.info("Deployment " + id + " is already gone");
                } else {
                  core.warning("Could not cancel " + id + ": " + error.message);
                }
              }
            }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

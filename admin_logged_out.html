<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>ログアウト | 列車走行位置 管理</title>
	<link rel="stylesheet" href="./css/admin_mainte.css">
</head>
<body>
	<main class="admin-page">
		<header class="admin-header">
			<div>
				<p class="admin-kicker">Maintenance Admin</p>
				<h1>ログアウトしました</h1>
			</div>
			<a href="https://takutaku716.github.io/trainlocation/location.html" class="admin-link">在線ページへ</a>
		</header>

		<section class="admin-panel">
			<p class="admin-status">管理画面からログアウトしました。再度編集する場合は、下のボタンからログインしてください。</p>
			<div class="admin-quick-buttons admin-logout-actions">
				<a id="adminLoginLink" href="./admin.html" class="admin-link">管理画面へログイン</a>
			</div>
		</section>
	</main>
	<script>
		document.getElementById("adminLoginLink").addEventListener("click", (event) => {
			event.preventDefault();
			location.replace("./admin.html?login=" + Date.now());
		});
	</script>
</body>
</html>
